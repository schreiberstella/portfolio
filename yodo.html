<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YODO – Vorsorgekalender – Stella Schreiber</title>
  <meta name="description" content="Projekt von Stella Schreiber.">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css?v=60">
  <!-- Lila-Fix -->
  <style>:root{--violett:#9f8ad6;--lila:#9f8ad6}.menue a:hover,.menue a:focus-visible,.menue a[aria-current="page"]{color:#fff}.zurueck{position:static;padding:0;margin:0 0 1.2rem;background:none}</style>
  <style>
    /* YODO: Titelbild oben, die weiteren Fotos als Galerie unter dem Text */
    #projektDetail[data-projekt="yodo"] .pfeil, #projektDetail[data-projekt="yodo"] .bild-zaehler { display: none; }
    .yodo-galerie { margin-top: clamp(2rem, 5vw, 4rem); display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(.7rem, 1.8vw, 1.4rem); }
    .yodo-galerie img { display: block; width: 100%; height: auto; }
    .yodo-galerie .breit { grid-column: 1 / -1; }
    @media (max-width: 700px) { .yodo-galerie { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="kopf">
    <a class="logo" href="index.html#portfolio" aria-label="Stella Schreiber – Startseite">
      <img src="logo.png" alt="">
      <span>Stella<br>Schreiber</span>
    </a>
    <button class="burger" id="menueAuf" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="menue">
      <i></i><i></i><i></i>
    </button>
  </header>

  <div class="scrim" id="scrim"></div>
  <nav class="menue" id="menue" aria-label="Bereiche">
    <button class="menue-zu" id="menueZu" type="button" aria-label="Menü schließen"></button>
    <ul>
      <li><a href="illustration.html">Illustration</a></li>
      <li><a href="animation.html">Animation</a></li>
      <li><a href="grafik-design.html">Grafik Design</a></li>
      <li><a href="fotografie.html">Fotografie</a></li>
    </ul>
  </nav>

  <main class="seite" id="projektDetail" data-bereich="grafik-design" data-projekt="yodo">
    <div class="projekt-spalte">
      <a class="zurueck" style="position:static !important;left:auto !important;bottom:auto !important;padding:0 !important;margin:0 0 1.2rem !important;background:none !important" id="zurueck" href="index.html#portfolio">&larr; Zurück</a>

      <div class="slider" id="projektSlider">
        <div class="spur" id="projektSpur" tabindex="0" aria-label="Bilder des Projekts"></div>
        <button class="pfeil pfeil-links" id="bildVor" type="button" aria-label="Voriges Bild"></button>
        <button class="pfeil pfeil-rechts" id="bildWeiter" type="button" aria-label="Nächstes Bild"></button>
      </div>

      <div class="projekt-info">
        <p class="bild-zaehler" id="bildZaehler" aria-live="polite"></p>
        <h1 class="projekt-name" id="projektTitel"></h1>
        <p class="projekt-meta" id="projektMeta" hidden></p>
        <div class="projekt-text" id="projektText"></div>
      </div>
    </div>
    <!-- Weitere Fotos: Dateien in bilder/yodo/ (gleicher Name = ersetzen) -->
    <div class="projekt-spalte yodo-galerie">
      <img src="bilder/yodo/02.jpg" width="1201" height="1600" loading="lazy" alt="Kalenderkarte zum Thema Bestattung vor der YODO-Box">
      <img src="bilder/yodo/03.jpg" width="1201" height="1600" loading="lazy" alt="Rückseite einer Kalenderkarte: Weiteres und Deine Gedanken mit Schreiblinien">
      <img src="bilder/yodo/04.jpg" width="1201" height="1600" loading="lazy" alt="Die geöffnete Box mit Anleitung, Notfallkarte und Kalender">
      <img class="breit" src="bilder/yodo/05.jpg" width="1600" height="1200" loading="lazy" alt="Notfallkarten zum Ausfüllen, daneben die Rückseite mit den Vorsorgedokumenten">
    </div>
    <noscript><p class="hinweis">Für diese Seite wird JavaScript benötigt.</p></noscript>
  </main>

  <footer class="fuss">
    <p>&copy; 2026 Stella Schreiber</p>
  </footer>

  <script src="projekte.js"></script>
  <script src="script.js"></script>
  <script>
    /* Link zum Forschungsprojekt der HTW unter dem Text */
    window.addEventListener('load', function () {
      var box = document.getElementById('projektText'); if (!box) return;
      /* Zwischenüberschriften fett */
      Array.prototype.forEach.call(box.querySelectorAll('p'), function (q, i) {
        var t = q.textContent.trim();
        if (i === 0 || t === 'Mein Beitrag' || t === 'Weiterführende Informationen') {
          q.style.cssText = 'font-family:var(--display);font-weight:900;margin-bottom:.3rem;' + (i ? 'margin-top:1.8rem;' : 'font-size:1.25em;');
        }
      });
      var p = document.createElement('p');
      var a = document.createElement('a');
      a.href = 'https://www.htw-berlin.de/forschung/online-forschungskatalog/projekte/projekt/?eid=3894';
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Hochschulprojekt im Forschungskatalog der HTW Berlin \u2192';
      a.style.cssText = 'text-decoration:underline;text-underline-offset:.2em;color:#000;transition:color .2s ease';
      a.addEventListener('mouseenter', function () { a.style.color = '#9f8ad6'; });
      a.addEventListener('mouseleave', function () { a.style.color = '#000'; });
      p.appendChild(a); box.appendChild(p);
    });
  </script>
</body>
</html>
